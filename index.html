<!doctype html>
<html
  lang="zh-CN"
  data-theme="qingge"
  data-scheme="light"
  data-zj-theme="qingge"
  data-zj-scheme="light"
  data-zj-scheme-mode="system"
  data-surface="product"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>折角界面实验室 · 个人 UI 基础</title>
    <meta
      name="description"
      content="可迁移的个人 UI 基础。用青格、刊次、硬边三套主题和工单产品样张比较排版、密度与交互状态。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        function read(key) {
          try {
            return localStorage.getItem(key);
          } catch (error) {
            return null;
          }
        }

        var themes = { qingge: 1, kanci: 1, yingbian: 1 };
        var surfaces = { reading: 1, product: 1, infra: 1 };
        var routeSurfaces = { "/reading": "reading", "/product": "product", "/infra": "infra" };
        var theme = read("zhejiao-theme");
        var schemeMode = read("zhejiao-scheme");
        var hasOwn = function (record, key) {
          return Object.prototype.hasOwnProperty.call(record, key);
        };
        var surface = hasOwn(routeSurfaces, location.pathname)
          ? routeSurfaces[location.pathname]
          : read("zhejiao-surface");

        if (!hasOwn(themes, theme)) theme = "qingge";
        if (schemeMode !== "system" && schemeMode !== "light" && schemeMode !== "dark") {
          schemeMode = "system";
        }
        if (!hasOwn(surfaces, surface)) surface = "product";

        var scheme =
          schemeMode === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : schemeMode;
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-scheme", scheme);
        root.setAttribute("data-zj-theme", theme);
        root.setAttribute("data-zj-scheme", scheme);
        root.setAttribute("data-zj-scheme-mode", schemeMode);
        root.setAttribute("data-surface", surface);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f%5B%5D=clash-display@500,600&f%5B%5D=satoshi@400,500,700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
