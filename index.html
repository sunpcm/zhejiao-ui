<!doctype html>
<html lang="zh-CN" data-theme="qingge" data-scheme="light" data-surface="product">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工单台 · 主题实验室</title>
    <meta
      name="description"
      content="同一套工单台。视觉主题是青格、刊次、硬边；版面是阅读、产品、运维。"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function () {
        try {
          var themes = { qingge: 1, kanci: 1, yingbian: 1 };
          var surfaces = { reading: 1, product: 1, infra: 1 };
          var theme = localStorage.getItem("zhejiao-theme");
          var scheme = localStorage.getItem("zhejiao-scheme");
          var surface = localStorage.getItem("zhejiao-surface");
          if (!themes[theme]) theme = "qingge";
          if (scheme !== "light" && scheme !== "dark") {
            scheme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (!surfaces[surface]) surface = "product";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.setAttribute("data-scheme", scheme);
          root.setAttribute("data-surface", surface);
        } catch (error) {
          /* 隐私模式写不进本地存储时，沿用默认浅色青格。 */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f%5B%5D=clash-display@500,600&f%5B%5D=satoshi@400,500,700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
